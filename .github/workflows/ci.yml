name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: referendum
          POSTGRES_PASSWORD: referendum
          POSTGRES_DB: referendum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U referendum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://referendum:referendum@127.0.0.1:5432/referendum
      DATABASE_URL_TEST: postgresql://referendum:referendum@127.0.0.1:5432/referendum_test
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-session-secret
      QUEUE_MODE: inline
      PUBLIC_BASE_URL: http://127.0.0.1:5173
      EMBEDDING_PROVIDER: local
      TRANSCRIPTION_PROVIDER: fixture
      MAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16-pgvector || true
      - name: Enable extensions and test database
        run: |
          sudo -u postgres psql -c "CREATE EXTENSION IF NOT EXISTS vector;" || psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "$DATABASE_URL" -c "CREATE DATABASE referendum_test;" || true
          psql "$DATABASE_URL_TEST" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql "$DATABASE_URL_TEST" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      - run: pnpm --filter @referendum/db migrate
      - run: DATABASE_URL="$DATABASE_URL_TEST" pnpm --filter @referendum/db migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @referendum/web test:e2e
